name: NSE 5% Equities Alert

on:
  schedule:
    # Runs at minute 0 and 30 past every hour from 4 UTC through 10 UTC, Mon-Fri
    # (Corresponds roughly to 9:30 AM - 3:30 PM IST during NSE market hours)
    - cron: '0,30 4-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  check-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Alert Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py
